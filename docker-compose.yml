services:
  client:
    build:
      context: ./roster-service/client
      dockerfile: Dockerfile
    container_name: roster-client
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - server
    networks:
      - roster-network

  server:
    build:
      context: ./roster-service/server
      dockerfile: Dockerfile
    container_name: roster-server
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_APP=app.py
    volumes:
      - ./roster-service/server:/app
      - ./roster-service/server/instance:/app/instance
    networks:
      - roster-network

  tactical-optimization:
    build:
      context: ./tactical-optimization-service/src
      dockerfile: Dockerfile
    container_name: tactical-optimization
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=development
      - FLASK_APP=app.py
    volumes:
      - ./tactical-optimization-service/src:/app
    networks:
      - roster-network

networks:
  roster-network:
    driver: bridge

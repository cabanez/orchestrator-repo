name: CI with Submodules

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # This step now fetches your main repo AND your submodules
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: true # or 'recursive' if your submodules have submodules

    - name: Run Ruff Linter
      uses: astral-sh/ruff-action@v3
      with:
        # Pass multiple paths separated by spaces
        args: "check ./roster-service/server"
